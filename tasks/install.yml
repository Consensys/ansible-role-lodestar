---
- name: Lookup lodestar user
  getent:
    database: passwd
    key: "{{ lodestar_user }}"
  register: lodestar_user_entry
  failed_when: false

- name: Extract current UID (only if user exists)
  set_fact:
    lodestar_current_uid: "{{ lodestar_user_entry.ansible_facts.getent_passwd[lodestar_user][1] | int }}"
  when: not lodestar_user_entry.failed

- name: Determine if UID update is needed
  set_fact:
    lodestar_uid_needs_update: "{{ lodestar_current_uid != lodestar_uid }}"
  when: not lodestar_user_entry.failed

- name: Stop lodestar  if UID needs update
  ansible.builtin.command:
    chdir: "{{ lodestar_base_dir }}"
    cmd: "docker compose down"
    # Docker compose does not removes this file. This is used to prevent running command
    # if docker-compose.yml does not present
    removes: "{{ lodestar_base_dir }}/docker-compose.yml"
  become: true
  become_method: sudo
  when:
    - not lodestar_user_entry.failed
    - lodestar_uid_needs_update

- name: Ensure lodestar group exists
  ansible.builtin.group:
    name: "{{ lodestar_group }}"
    gid: "{{ lodestar_gid }}"    
    state: present
  become: true
  register: lodestar_group_details

- name: Create lodestar user
  ansible.builtin.user:
    comment: lodestar client user
    name: "{{ lodestar_user }}"
    uid: "{{ lodestar_uid }}"    
    group: "{{ lodestar_group }}"
  become: true
  register: lodestar_user_details

- name: Create directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: "{{ lodestar_user }}"
    group: "{{ lodestar_group }}"
    recurse: true
  loop:
    - "{{ lodestar_base_dir }}"
    - "{{ lodestar_config_dir }}"
    - "{{ lodestar_data_dir }}"
    - "{{ lodestar_log_dir }}"
  become: true

- name: Setup logrotate
  ansible.builtin.template:
    src: "logrotate/lodestar"
    dest: "/etc/logrotate.d/lodestar"
  become: true

# Running as root. App user might not have permission at this point
- name: Stop lodestar
  ansible.builtin.command:
    chdir: "{{ lodestar_base_dir }}"
    cmd: "docker compose down"
    # Docker compose does not removes this file. This is used to prevent running command
    # if docker-compose.yml does not present
    removes: "{{ lodestar_base_dir }}/docker-compose.yml"
  become: true
  become_method: sudo

- name: Create docker-compose.yml file
  ansible.builtin.template:
    src: lodestar-compose.yml.j2
    dest: "{{ lodestar_base_dir }}/docker-compose.yml"
    owner: "{{ lodestar_user }}"
    group: "{{ lodestar_group }}"
    mode: 0644
  become: yes

- name: Give access to docker.sock
  acl:
    path: /var/run/docker.sock
    entity: 1000
    etype: user
    permissions: rw
    state: present
  become: yes

- name: Restart lodestar
  ansible.builtin.command:
    chdir: "{{ lodestar_base_dir }}"
    cmd: "docker compose up -d"
  become: true
  become_method: sudo
